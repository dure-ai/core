name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only checks out the code and runs the tests; keep the token read-only whatever the
# repository default is.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: cortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CORTEX_TEST_PG_URL: postgresql://postgres:cortex@localhost:5432/postgres
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
