name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only checks out the code and runs the tests; keep the token read-only whatever the
# repository default is.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Lint and type checks run once, on the lowest supported version (pyproject targets 3.12).
      - if: matrix.python == '3.12'
        run: uv run ruff check src server/src tests server/tests conftest.py
      - if: matrix.python == '3.12'
        run: uv run basedpyright src server/src
      - run: uv run pytest -q -W error
