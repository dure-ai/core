name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What you would like to see, and the problem it solves. Describe the current behavior too if it helps.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: How it would be used, such as a call sequence, a contract change, or the result you expect.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you looked at and why you did not pick them.
    validations:
      required: false
