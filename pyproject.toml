[project]
name = "cortex-mem-mcp"
version = "0.1.0"
description = "MCP server and engine port contract for cortex-mem, an agent memory engine that promotes memories to knowledge on evidence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "The cortex-mem authors" }]
dependencies = [
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_mem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
