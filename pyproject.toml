[project]
name = "cortex-mem"
version = "0.1.0"
description = "Engine port contract and runtime for cortex-mem, an agent memory engine that promotes memories to knowledge on evidence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "The cortex-mem authors" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "cortex-mem-server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_mem"]

[tool.uv.workspace]
members = ["server"]

[tool.uv.sources]
cortex-mem-server = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "server/tests"]
