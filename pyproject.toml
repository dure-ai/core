[project]
name = "cortex-mem-mcp"
version = "0.1.0"
description = "MCP server and engine port contract for cortex-mem, an agent memory engine that promotes memories to knowledge on evidence."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "The cortex-mem authors" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_mem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Check against the lowest supported Python so newer-only syntax is caught.
[tool.ruff]
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
